# This is a basic workflow to help you get started with Actions

name: build

# Controls when the action will run.
on:
  schedule:
    - cron: "0 0 1 * *" # monthly
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Emacs version or tag to build (e.g. "31.1", "emacs-31.1", or "stable" for latest stable)'
        required: false
        default: 'stable'
        type: string

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  prepare_env:
    name: Prepare build version
    runs-on: ubuntu-latest
    env:
      EMACS_REPO: https://github.com/emacs-mirror/emacs.git
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Get build version
        id: vars
        run: |
          VERSION_INPUT="${{ inputs.version }}"
          if [ -n "$VERSION_INPUT" ] && [ "$VERSION_INPUT" != "stable" ] && [ "$VERSION_INPUT" != "latest" ]; then
            if [[ "$VERSION_INPUT" =~ ^[0-9] ]]; then
              TAG="emacs-${VERSION_INPUT}"
            else
              TAG="$VERSION_INPUT"
            fi
          else
            echo "Querying latest stable Emacs tag from $EMACS_REPO..."
            TAG=$(git ls-remote --tags --refs "$EMACS_REPO" 'refs/tags/emacs-[0-9]*' \
              | sed 's#.*/##' \
              | grep -E '^emacs-[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1)
          fi

          if [ -z "$TAG" ]; then
            echo "Error: Failed to resolve stable Emacs version tag from $EMACS_REPO"
            exit 1
          fi

          echo "Selected Emacs tag: $TAG"
          TAG_VER="${TAG#emacs-}"

          mkdir -p ./git/emacs
          cd ./git/emacs/
          git clone --depth 1 --branch "$TAG" "$EMACS_REPO" .
          ts=`date +'%Y%m%d'`
          commit=`git rev-parse --short=8 HEAD`
          major_ver=`cat configure.ac | grep -Po 'AC_INIT\(.*\[\K\d+'`
          IFS='.' read -r major minor patch <<< "$TAG_VER"
          minor=${minor:-0}

          version="${TAG_VER}.${{ github.run_number }}.${ts}.${commit}"
          pkg_version="${major:-$major_ver}.${minor}.${{ github.run_number }}.0"

          echo "commit=${commit}" >> $GITHUB_ENV
          echo "commit=${commit}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "tag_ver=${TAG_VER}" >> $GITHUB_ENV
          echo "tag_ver=${TAG_VER}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_ENV
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "pkg_version=${pkg_version}" >> $GITHUB_ENV
          echo "pkg_version=${pkg_version}" >> $GITHUB_OUTPUT
    outputs:
      repo: ${{ env.EMACS_REPO }}
      version: ${{ env.version }}
      pkg_version: ${{ env.pkg_version }}
      commit: ${{ env.commit }}
      tag: ${{ env.tag }}
      tag_ver: ${{ env.tag_ver }}

  build_windows:
    needs: prepare_env
    name: Build Emacs (Windows Arm64)
    runs-on: windows-11-arm
    timeout-minutes: 90
    env:
      EMACS_REPO: ${{ needs.prepare_env.outputs.repo }}
      EMACS_COMMIT: ${{ needs.prepare_env.outputs.tag }}
      EMACS_PKG_VERSION: ${{ needs.prepare_env.outputs.pkg_version }}
      EMACS_CERT_SECRET: ${{ secrets.EMACS_CERT_SECRET }}
      MSYSTEM: CLANGARM64
      BUILD_OPTIONS: --without-native-compilation --without-mps

    defaults:
      run:
        shell: powershell

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Setup Msys2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          release: true

      - name: Update MSYS2_DIR environment variable
        run: |
          echo "MSYS2_DIR=${{ steps.msys2.outputs.msys2-location }}" >> $env:GITHUB_ENV

      # This is the shortest job, but in this case it pulls all MSYS/MINGW64
      - name: Clone Emacs
        run: .\emacs-build.cmd --clone --repo $env:EMACS_REPO --branch $env:EMACS_COMMIT

      - name: Install deps
        run: |
          .\emacs-build.cmd --slim --ensure $env:BUILD_OPTIONS

      - name: Build Emacs
        # Require --with-* flags, else the deps will not be included properly
        run: |
          .\emacs-build.cmd --slim --branch $env:EMACS_COMMIT --configure --build-dev $env:BUILD_OPTIONS

      - name: Package Emacs
        run: |
          $env:MSIXHeroCLI = &where.exe MSIXHeroCLI
          if ($env:MSIXHeroCLI) {
            .\emacs-build.cmd --slim --branch $env:EMACS_COMMIT --msix --pack-all $env:BUILD_OPTIONS
          } else {
            .\emacs-build.cmd --slim --branch $env:EMACS_COMMIT --pack-all $env:BUILD_OPTIONS
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emacs-${{ needs.prepare_env.outputs.tag_ver }}-windows-arm64
          path: ./zips/*{_full.zip,.msix}
          if-no-files-found: warn

      # Upload release for each build
      - name: Upload binaries to release
        id: upload_release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: ./zips/*{_full.zip,.msix}
          file_glob: true
          tag: v${{ needs.prepare_env.outputs.version }}
          release_name: emacs_${{ needs.prepare_env.outputs.version }}
          draft: false
          prerelease: false
          overwrite: true

